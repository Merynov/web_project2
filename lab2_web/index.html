<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2</title>
    <style>
        body 
        {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
            background-color: #fff; 
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 400px;
            margin: 0 auto; 
        }

        li {
            margin-bottom: 15px; 
        }

        a {
            display: block; 
            text-decoration: none; 
            
            background-color: #f5f5dc; 
            color: black;         
            
            padding: 15px 20px;      
            border-radius: 8px;       
            border: 1px solid #ccc;   
            font-size: 18px;
            transition: background 0.3s;
        }

        a:hover {
            background-color: #e0e0c0; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Лабораторна робота №2</h1>
    
    <ul>
        <li><a href="grid.html">Варіант 1: CSS Grid</a></li>
        <li><a href="flex.html">Варіант 2: Flexbox</a></li>
       
    </ul>

</body>
</html>
